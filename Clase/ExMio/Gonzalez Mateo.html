    <h2>
        1. En un documento html crea un script que te pida tres numeros enteros
        con un prompt y haga la siguiente formula (Numero1*Numero2 + Numero3)*Numero3.
        Ojo deben ser numeros para ello debes comprobar su tipo si no son
        enteros debes dar un error.
    </h2>
    <div id="Ej1"></div>

    <script>

        let num1 = parseInt(prompt("Introduce el primer número: "));
        let num2 = parseInt(prompt("Introduce el segundo número: "));
        let num3 = parseInt(prompt("Introduce el tercer número: "));
        
        let resultado = 0;
        if(isNaN(num1) || isNaN(num2) || isNaN(num3)){
            document.getElementById("Ej1").innerHTML = "Error, valor introducido invalido.";
        }else{
            resultado = (num1 * num2 * num3) * num3;
            document.getElementById("Ej1").innerHTML = "Resultado: " + resultado;
        }

    </script>

    <h2>Ej 4.</h2>
    <div id="Ej4"></div>

    <script>

        let numero4 = prompt("Introduce un número: ");
        let numero4_1 = prompt("Introduce otro número: ");
        let operacion = prompt("Introduce operando: ");

        let entero4 = parseInt(numero4);
        let entero4_1 = parseInt(numero4_1);

        let resultado4 = "";
        if(numero4 == null || numero4.trim() == "" || numero4_1 == null || numero4_1.trim() == ""
            || isNaN(entero4) || isNaN(entero4_1)
        ){
            document.getElementById("Ej4").innerHTML = "Dato invalido";
        }else{
            switch(operacion){
                case "AND":
                    resultado4 = (entero4 & entero4_1);
                    break;
                case "OR":
                    resultado4 = (entero4 | entero4_1);
                    break;
                case "XOR":
                    resultado4 = (entero4 ^ entero4_1);
                    break;
                case "DIZQ":
                    resultado4 = (entero4 << entero4_1);
                    break;
                case "DDER":
                    resultado4 = (entero4 >> entero4_1);
                    break;
                default:
                    resultado4 = "Operador invalido";
                    break;

            }
            if(resultado4 == "Operador invalido"){
                document.getElementById("Ej4").innerHTML = resultado4;
            }else{
                document.getElementById("Ej4").innerHTML = "Decimal: " + entero4 + " " + operacion + " " + entero4_1
                + " = " + resultado4 + "<br>" + "Binario: " + entero4 + " " + operacion + " " + entero4_1
                + " = " + (resultado4 >>> 0).toString(2) + "<br>";
            }
            
        } 

    </script>
