    <div id="prueba1"></div>

    <script>

        // isArray()
        let arr1 = [1,2,3,4,5];
        document.getElementById("prueba1").innerHTML = `<h2>isArray()</h2>
        Es ${arr1} un array? ${Array.isArray(arr1)}<br>
        `; 

    </script>

    <div id="prueba2"></div>

    <script>

        let arraEvery = [1, 30, 39, 29, 10, 13];

        let arraParImpar = [0, 1, 2, 3, 4, 5];

        let menoresDiez = arraEvery.every((elemento) => elemento < 10)
        
        let menoresCien = arraEvery.every((elemento) => elemento < 100)

        let indiceParIndiceImpar = arraParImpar.every((elemento,indice) =>{
            indice % 2 == 0? elemento % 2 == 0: elemento % 2 != 0
            indice % 2 != 0? elemento % 2 != 0: elemento % 2 == 0
        });

        document.getElementById("prueba2").innerHTML = `<h2>Array.every()</h2>
        Son todos los elementos de este array ${arraEvery} menores que diez: ${menoresDiez}<br>
        Son todos los elementos de este array ${arraEvery} menores que cien: ${menoresCien}<br>
        Son todos los elementos de este array par impar par impar ${arraParImpar} menores que cien: ${indiceParIndiceImpar}<br>`;
    </script>
