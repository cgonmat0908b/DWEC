    <div id="prueba2"></div>

    <script>

        const numbers = [1, 2, 3, 4, 5];
        const str = ["Paco"];
        const sum = numbers.reduce((acum, elem) => acum + elem, 0);

        // Producto
        const producto = numbers.reduce((acum, elem) => acum * elem, 1);

        // maximo
        const max = numbers.reduce((acum, elem) => acum > elem ? acum : elem,-Infinity);
        // minimo
        const min = numbers.reduce((acum, elem) => acum < elem ? acum : elem,Infinity);
        // Array a string
        const cadena = str.reduce((acum, elem) =>(acum == "")?elem:acum + "-" + elem,"");
        //Reto 4: Contar la cantidad de veces que se repite cada elemento en un array.
        let cantidadRepetida = numbers.reduce((acum, elem) =>{
            if(acum[elem] == undefined){
                acum[elem] = 1;
            }else{
                acum[elem] = acum[elem] + 1
            }
            return acum;
        });
        document.getElementById("prueba2").innerHTML = `<h2>Reduce</h2>
        Suma del 1 al 5: ${sum}<br>
        Producto del array: ${numbers}: ${producto}<br>
        Mayor num del array: ${max}<br>
        Menor num del array: ${min}<br>
        ${cadena}<br>
        <br>`; 
    </script>
