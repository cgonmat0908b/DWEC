    <h2>1. Toma una entrada con window.prompt() y que nos pida
    la un radio y debemos calcular la ci2rcunferencia 
    (2*PI*Radio) y el area ( PI*Radio2)</h2>
    <div id="Ej1"></div>

    <script>

        let radio = parseFloat(prompt("1. Introduce un radio: "));

        let circunferencia = 2 * Math.PI * radio;

    <h2>5. Toma como entrada un angulo entre 0 y 360 con window.prompt() y nos la debe
    convertir en radianes ( radianes = (grados/180)*PI ) debe tener un if para que su
    valor este entre 0 y 360 en caso contrario debe dar error.</h2>
    <div id="Ej5"></div>

    <script>

        let angulo = parseFloat(prompt("5. Introduce un ángulo: "))
        let radianes = 0;

        if(isNaN(angulo) || angulo <= 0 || angulo > 360){
            document.getElementById("Ej5").innerHTML = "Invalido"
        }else{
            radianes = (angulo / 180) * Math.PI;
            document.getElementById("Ej5").innerHTML = "Radianes: " + radianes;
        }

    </script>
    
    <h2>6. Modifica el anterior script para muestre los siguientes valores del valor tomado
        <br>1. cos(x) Devuelve el coseno de x (x está en radianes).<br>
        2. sin(x) Devuelve el seno de x (x está en radianes).<br>

        3. tan(x) Devuelve la tangente de un ángulo.<br>
    </h2>
    <div id="Ej6"></div>

    <script>

        angulo = parseFloat(prompt("5. Introduce un ángulo: "))
        radianes = 0;
        let cos = 0;
        let seno = 0;
        let tan = 0;

        if(isNaN(angulo) || angulo <= 0 || angulo > 360){
            document.getElementById("Ej6").innerHTML = "Invalido"
        }else{
            radianes = (angulo / 180) * Math.PI;

            // 1 cos(x)
            cos = Math.cos(radianes);

            // sin(x)
            seno = Math.sin(radianes);

            // tan(x)
            tan = Math.tan(radianes);

            document.getElementById("Ej6").innerHTML = "Coseno: " + cos +
            "<br>" + "Seno: " + seno +
            "<br>" + "Tangente " + tan;
        }

    </script>
    
    <h2>7. Toma una entrada con window.prompt() y debe tener un if para que

    1. acos(x) Devuelve el arcocoseno de x, en radianes.<br>
    2. asin(x) Devuelve el arcoseno de x, en radianes.<br>
    3. atan(x) Devuelve el arcotangente de x, en radianes con un valor entre -PI/2 y PI/2.</h2>

    <script>

        let num7 = parseFloat(prompt("7. Número entre 0 y 1: "));

        let arcoTangente = 0;

    <h2>
        10. Toma numeros con window.prompt() hasta que el numero entrado sea 0 y calcula su máximo y mínimo
        max(x,y,z,...,n) Devuelve el número más alto de los que se pasan como parámetros.
        min(x,y,z,...,n) Devuelve el número más bajo de los que se pasan como parámetros.
    </h2>
    <div id="Ej10"></div>

    <script>

        let continuar = true
        let max = 0;
        let min = 0;
        let numsEj10 = 0;

        let numeros = [];

        while(continuar){
            numsEj10 = parseFloat(prompt("10. Introduce un número: "));
            if(numsEj10 == 0){
                continuar = false;
            }else{
                if(!isNaN(numsEj10)){
                    numeros.push(numsEj10)
                }
            }
        }

        if(numeros.length > 0){
            max = Math.max(...numeros);
            min = Math.min(...numeros);
        }else{
            max = "Valores no introducidos";
            min = "Valores no introducidos";
        }

        document.getElementById("Ej10").innerHTML = `<p>Valor máximo de los introducidos: ${max}
            </p><p>Valor mínimo de los introducidos: ${min}</p>`;

    </script>

    <h2>
        14. Toma una entrada con window.prompt() a b c y resulelve la ecuación
    </h2>
    <div id="Ej14"></div>

    <script>
        let entrada1Ej14 = Number(prompt("14.A:"));
        let entrada2Ej14 = Number(prompt("14.B:"));
        let entrada3Ej14 = Number(prompt("14.C:"));
        let resultadoEj14 = "";

        if(entrada1Ej14 != 0 && !isNaN(entrada1Ej14) && !isNaN(entrada2Ej14) && !isNaN(entrada3Ej14) && entrada1Ej14 != null && entrada2Ej14 != null && entrada3Ej14 != null){
            let positivo = ecuacionPositiva(entrada1Ej14,entrada2Ej14,entrada3Ej14);
            let negativo = ecuacionNegativa(entrada1Ej14,entrada2Ej14,entrada3Ej14);
            
            resultadoEj14 = `<p>Resultado positivo: ${positivo}</p>
            <p>Resultado negativo: ${negativo}</p>`;

        }else{
            resultadoEj14 = "No es posible.";
        }
        
        function ecuacionPositiva(a,b,c){
            let resultado = 0;
            let discriminante = Math.pow(b,2) - 4 * a * c;
            
            if(discriminante > 0){
                resultado = (-b + Math.sqrt(discriminante)) / (2 * a)

            }else if(discriminante < 0){
                resultado = "No es posible.";

            }else{
                resultado = -b / (2 * a);

            }

            return resultado;
        }

        function ecuacionNegativa(a,b,c){
            let resultado = 0;
            let discriminante = Math.pow(b,2) - 4 * a * c;

            if(discriminante > 0){
                resultado = (-b - Math.sqrt(discriminante)) / (2 * a)

            }else if(discriminante < 0){
                resultado = "No es posible.";

            }else{
                resultado = -b / (2 * a);

            }

            return resultado;
        }

        document.getElementById("Ej14").innerHTML = resultadoEj14;

    </script>

    <h2>
        15. Toma una entrada con window.prompt() para tomar a1 a2 b1 b2 c1 c2 <br>
        1. Sea un sistema <br>
        a1x+b1y =c1 <br>
        a2x+b2y =c2 <br>
        Resuelvelo <br>
    </h2>
    <div id="Ej15"></div>
    
    <script>

        let a1 = Number(prompt("15. A1:"));
        let b1 = Number(prompt("15. B1:"));
        let c1 = Number(prompt("15. C1:"));
        let a2 = Number(prompt("15. A2:"));
        let b2 = Number(prompt("15. B2:"));
        let c2 = Number(prompt("15. C2:"));

        let determinante = a1 * b2  - a2 * b1;
        let determinanteX = c1 * b2 - c2 * b1;
        let determinanteY = a1 * c2 - a2 * c1;

        let x = 0;
        let y = 0;

        let resultadoEj15 = "";

        if(determinante != 0){
            x = determinanteX / determinante;
            y  = determinanteY / determinante;
            resultadoEj15 = `<p>X = ${x}, Y = ${y}</p>`;
        }else{
            resultadoEj15 = "Solución indefenida";
        }

        document.getElementById("Ej15").innerHTML = resultadoEj15;

    </script>
