    <h2>
        Ejercicio 1. Crea una función Ej1Trigonometica que se le pase dos parametros
    </h2>
    <div id="Ej1"></div>

    <script>

        let Ej1Trigonometrica = (angulo,operacion) => {
            let radian = angulo * Math.PI / 180;
            let resultado = 0;

            if(operacion == "cos"){
                resultado = Math.cos(radian);
            }else if(operacion == "sen"){
                resultado = Math.sin(radian);
            }else if(operacion == "tan"){
                resultado = Math.tan(radian);
            }

            return resultado;
        };

        let angulo = Number(prompt("1. Introduce el ángulo:"));
        let operacion = prompt("1. Operación a realizar:");
        let resultadoEj1 = "";

        if(isFinite(angulo) && !(angulo <= 0) && (operacion == "cos" || operacion == "sen" || operacion == "tan")){
            resultadoEj1 = `Resultado de la operación: ${Ej1Trigonometrica(angulo,operacion)}`;
        }else{
            resultadoEj1 = "Valor invalido";
        }

        document.getElementById("Ej1").innerHTML = resultadoEj1;

    </script>

    <div id="Ej9"></div>

                [i + 2, i + 4, i + 6],
                [i + 7, i, i + 5]
            ];

        document.getElementById("Ej9").innerHTML = `
